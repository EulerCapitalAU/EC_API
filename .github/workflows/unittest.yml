name: Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Conan
        run: pip install conan

      - name: Set up Conan profile
        run: conan profile detect --force

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Conan Install C++ test Dependencies
        run: conan install ./conanfile.txt --output-folder=build --build=missing
          
      - name: CMake Config
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          
      - name: CMake build 
        run: cmake --build build
    
      - name: Pip Install EC_API Package
        run: pip install -e .
      
      - name: Install Redis
        run: |
          sudo apt-get update 
          sudo apt-get install -y redis-server

      - name: Run Python unit tests
        run: pytest --cov --cov-branch --cov-report=xml

      - name: Run C++ unit tests        
        run: ctest --test-dir build

      - name: Generate C++ coverage report
        run: gcovr --root . build --filter --xml-pretty --output coverage_cpp.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml, coverage_cpp.xml

