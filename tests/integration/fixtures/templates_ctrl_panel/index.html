<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EC Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg: #0b0f17; --panel: #111827; --panel-2: #0f172a; --border: #1f2937;
      --text: #e5e7eb; --muted: #94a3b8; --accent: #60a5fa; --danger: #f87171;
      --pill-bg: #1e293b; --pill-bd: #334155; --input-bg: #0b1220; --input-bd: #23324a; --good: #4ade80;
      --radius: 14px; --radius-sm: 10px; --gap: 14px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: radial-gradient(1200px 800px at 10% -10%, #0f172a 0%, #0b0f17 45%, #090d14 100%);
      color: var(--text);
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      background: rgba(9,13,20,.6);
    }
    .title { font-size: 17px; font-weight: 600; }
    .muted { color: var(--muted); font-size: 13px; }
    input, select, textarea {
      color: var(--text); background: var(--input-bg);
      border: 1px solid var(--input-bd); border-radius: var(--radius-sm); padding: 9px 12px;
      font-size: 14px;
    }
    button {
      cursor: pointer; color: var(--text); background: var(--panel);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 9px 14px; font-size: 14px;
    }
    button:hover { filter: brightness(1.15); }
    button:active { transform: translateY(1px); }
    .btn-accent { border-color: #3b82f6; box-shadow: inset 0 0 0 1px rgba(59,130,246,.3); }
    .btn-danger { border-color: #ef4444; box-shadow: inset 0 0 0 1px rgba(239,68,68,.35); }

    .transport { display: flex; gap: 10px; align-items: center; justify-content: center; }

    .btn-circle {
      width: 42px; height: 42px; border-radius: var(--radius-sm); padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 15px; line-height: 1;
      border: 2px solid var(--accent);
    }
    .btn-kill { color: #ef4444; }
    .btn-kill:hover { background: var(--accent); color: #0b0f17; }

    .av-toggle .av-on { color: var(--good); border-color: var(--good); }
    .av-toggle .av-on:hover { background: var(--good); color: #0b0f17; }
    .av-toggle .av-off { color: var(--danger); border-color: var(--danger); }
    .av-toggle .av-off:hover { background: var(--danger); color: #0b0f17; }

    .av-toggle { display: inline-flex; }
    .av-toggle[data-state="off"] .av-off,
    .av-toggle[data-state="on"] .av-on,
    .av-toggle[data-state="play"] .av-play,
    .av-toggle[data-state="pause"] .av-pause { display: none; }

    .tab-radio { display: none; }

    .app {
      display: grid;
      grid-template-columns: 1fr 1.5fr 0.5fr 3fr;
      min-height: calc(100vh - 57px);
    }

    .nav-col {
      border-right: 1px solid var(--border); padding: 18px 10px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .control-col {
      border-right: 1px solid var(--border); padding: 20px;
      display: flex; flex-direction: column; gap: var(--gap);
    }
    .symbols-col {
      border-right: 1px solid var(--border); padding: 20px;
      display: flex; flex-direction: column; gap: var(--gap);
    }
    .display-col { padding: 20px; display: flex; flex-direction: column; gap: var(--gap); }

    .tab-label {
      display: flex; align-items: center;
      padding: 10px 14px; border-radius: var(--radius-sm);
      color: var(--muted); cursor: pointer; user-select: none;
    }
    .tab-label:hover { background: var(--panel); color: var(--text); }

    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger); margin-right: 8px; flex-shrink: 0;
    }
    .status-dot.online { background: var(--good); }

    .page { display: none; flex-direction: column; gap: var(--gap); }

    #tab-data:checked ~ .app .nav-col label[for="tab-data"],
    #tab-trade:checked ~ .app .nav-col label[for="tab-trade"],
    #tab-monitor:checked ~ .app .nav-col label[for="tab-monitor"] {
      background: var(--panel); color: var(--text); box-shadow: inset 2px 0 0 var(--accent);
    }
    #tab-data:checked ~ .app #control-data,
    #tab-data:checked ~ .app #symbols-data,
    #tab-data:checked ~ .app #display-data,
    #tab-trade:checked ~ .app #control-trade,
    #tab-trade:checked ~ .app #symbols-trade,
    #tab-trade:checked ~ .app #display-trade,
    #tab-monitor:checked ~ .app #control-monitor,
    #tab-monitor:checked ~ .app #symbols-monitor,
    #tab-monitor:checked ~ .app #display-monitor {
      display: flex;
    }

    .panel {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px;
    }
    .panel h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .pill {
      display: inline-flex; align-items: center;
      background: var(--pill-bg); border: 1px solid var(--pill-bd);
      border-radius: 999px; padding: 5px 10px; font-size: 12px;
    }
    .observe {
      border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 14px; min-height: 160px; color: var(--muted);
      display: flex; flex-direction: column; gap: 8px;
    }
    .observe h3 { margin: 0; font-size: 13px; color: var(--text); font-weight: 600; }
    .observe .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="title">EC Control Panel</div>
    <input id="apiKey" value="{{ api_key_prefill }}" placeholder="X-API-Key" style="min-width:220px;" />
  </header>

  <input type="radio" name="tab" id="tab-data" class="tab-radio" checked>
  <input type="radio" name="tab" id="tab-trade" class="tab-radio">
  <input type="radio" name="tab" id="tab-monitor" class="tab-radio">

  <div class="app">
    <nav class="nav-col">
      <label for="tab-data" class="tab-label"><span class="status-dot" id="status-data"></span>Data Engine</label>
      <label for="tab-trade" class="tab-label"><span class="status-dot" id="status-trade"></span>Trade Engine</label>
      <label for="tab-monitor" class="tab-label"><span class="status-dot" id="status-monitor"></span>Monitor Engine</label>
    </nav>

    <main class="control-col">
      <section id="control-data" class="page">
        <div class="panel">
          <h2>Engine Control</h2>
          <div class="row transport">
            <div class="av-toggle" data-state="off">
              <button class="btn-circle av-on" title="Start"
                hx-post="/action/cmd/start_data_engine" hx-swap="none"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'
                onclick="this.closest('.av-toggle').dataset.state='on'; document.getElementById('freeze-data').dataset.state='play';">&#9211;</button>
              <button class="btn-circle av-off" title="Stop"
                hx-post="/action/cmd/stop_data_engine" hx-swap="none"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'
                onclick="this.closest('.av-toggle').dataset.state='off'; document.getElementById('freeze-data').dataset.state='pause';">&#9211;</button>
            </div>

            <div class="av-toggle" data-state="pause" id="freeze-data">
              <button class="btn-accent btn-circle av-pause" title="Pause"
                hx-post="/action/cmd/freeze_data_engine" hx-swap="none"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'
                onclick="this.closest('.av-toggle').dataset.state='pause'">&#9208;</button>
              <button class="btn-accent btn-circle av-play" title="Resume"
                hx-post="/action/cmd/unfreeze_data_engine" hx-swap="none"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'
                onclick="this.closest('.av-toggle').dataset.state='play'">&#9654;</button>
            </div>

            <button class="btn-kill btn-circle" title="Kill"
              hx-post="/action/cmd/shutdown_data_engine" hx-swap="none"
              hx-confirm="Shut down the data engine — the process will need a restart."
              hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'>&#10005;</button>
          </div>
        </div>

        <div class="panel">
          <h2>Data Feeds</h2>
          <form class="col">
            <input name="symbols" placeholder="e.g. WTI,NATGAS" />
            <div class="row">
              <button class="btn-accent" type="submit" hx-post="/action/datafeeds/add"
                hx-target="#feeds-list"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'>Add</button>
              <button class="btn-accent" type="submit" hx-post="/action/datafeeds/remove"
                hx-target="#feeds-list"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'>Remove</button>
              <button class="btn-danger" type="submit" hx-post="/action/datafeeds/remove_all"
                hx-target="#feeds-list"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'>Remove All</button>
            </div>
          </form>
        </div>
      </section>

      <section id="control-trade" class="page">
        <div class="panel">
          <h2>Engine Control</h2>
          <div class="row transport">
            <div class="av-toggle" data-state="off">
              <button class="btn-circle av-on" title="Start"
                hx-post="/action/cmd/start_trade_engine" hx-swap="none"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'
                onclick="this.closest('.av-toggle').dataset.state='on'; document.getElementById('freeze-trade').dataset.state='play';">&#9211;</button>
              <button class="btn-circle av-off" title="Stop"
                hx-post="/action/cmd/stop_trade_engine" hx-swap="none"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'
                onclick="this.closest('.av-toggle').dataset.state='off'; document.getElementById('freeze-trade').dataset.state='pause';">&#9211;</button>
            </div>

            <div class="av-toggle" data-state="pause" id="freeze-trade">
              <button class="btn-accent btn-circle av-pause" title="Pause"
                hx-post="/action/cmd/freeze_trade_engine" hx-swap="none"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'
                onclick="this.closest('.av-toggle').dataset.state='pause'">&#9208;</button>
              <button class="btn-accent btn-circle av-play" title="Resume"
                hx-post="/action/cmd/unfreeze_trade_engine" hx-swap="none"
                hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'
                onclick="this.closest('.av-toggle').dataset.state='play'">&#9654;</button>
            </div>

            <button class="btn-kill btn-circle" title="Kill"
              hx-post="/action/cmd/shutdown_trade_engine" hx-swap="none"
              hx-confirm="Shut down the trade engine — the process will need a restart."
              hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'>&#10005;</button>
          </div>
        </div>

        <div class="panel">
          <h2>Risk Control</h2>
          <div class="row">
            <button class="btn-danger" hx-post="/action/cmd/goflat" hx-target="#flash"
              hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'>Go Flat</button>
            <button class="btn-danger" hx-post="/action/cmd/cancelall" hx-target="#flash"
              hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'>Cancel All</button>
          </div>
          <div id="flash"></div>
        </div>
      </section>
      <section id="control-monitor" class="page">
        <div class="panel">
          <h2 class="muted">Monitor Engine</h2>
        </div>
      </section>
    </main>

    <aside class="symbols-col">
      <section id="symbols-data" class="page">
        <div class="panel">
          <h2>Active Symbols</h2>
          <div id="feeds-list" hx-get="/ui/feeds" hx-trigger="load"
            hx-headers='js:{"X-API-Key": document.getElementById("apiKey").value}'></div>
        </div>
      </section>

      <section id="symbols-trade" class="page">
        <div class="panel">
          <h2 class="muted">Active Symbols</h2>
        </div>
      </section>

      <section id="symbols-monitor" class="page">
        <div class="panel">
          <h2 class="muted">Active Symbols</h2>
        </div>
      </section>
    </aside>

    <aside class="display-col">
      <section id="display-data" class="page">
        <div class="observe">
          <h3>Live Tick Feed</h3>
          <div class="placeholder">WS feed not wired yet — reserved for streaming tick data.</div>
        </div>
      </section>

      <section id="display-trade" class="page">
        <div class="observe">
          <h3>Order Confirmations</h3>
          <div class="placeholder">Reserved for live order/fill confirmations.</div>
        </div>
      </section>

      <section id="display-monitor" class="page">
        <div class="observe">
          <div class="placeholder">—</div>
        </div>
      </section>
    </aside>
  </div>
</body>
</html>
